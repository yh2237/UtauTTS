openapi: 3.0.3
info:
  title: UtauTTS Server HTTP API
  version: development
  description: |
    現行の開発版HTTP API。
    エラーは常に {"error":"説明","code":"分類"} のJSONで返す。未定義のパスは404 not_found、
    対応していないメソッドは405 method_not_allowed で、どちらも同じ形式。
servers:
  - url: /
paths:
  /api/openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: このOpenAPI仕様を取得
      responses:
        '200':
          description: リポジトリのopenapi.yamlと同じUTF-8 YAML
          content:
            application/yaml:
              schema: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/health:
    get:
      operationId: getHealth
      summary: 稼働確認と実行枠の使用状況
      description: サーバーが稼働していれば200を返す。音源の状態は /api/voicebanks で確認する。
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/voicebanks:
    get:
      operationId: listVoicebanks
      summary: ID順の音源一覧
      responses:
        '200': &voicebanksResponse
          description: 音源一覧。空の場合も配列を返す。
          content:
            application/json:
              schema:
                type: object
                required: [voicebanks]
                properties:
                  voicebanks:
                    type: array
                    items: {$ref: '#/components/schemas/Voicebank'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/voicebanks/reload:
    post:
      operationId: reloadVoicebanks
      summary: 音源ディレクトリを再走査
      description: 実行中のRuntime要求の完了を待って自分の資源を再読込する。モデルのカタログは再探索しない。
      responses:
        '200': *voicebanksResponse
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/models:
    get:
      operationId: listModels
      summary: 抑揚モデル一覧
      responses:
        '200':
          description: 起動時のモデルカタログ
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    nullable: true
                    items: {$ref: '#/components/schemas/Model'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/settings:
    get:
      operationId: listSettings
      summary: 合成設定の一覧
      description: settingsで指定できる設定の既定値と範囲。methodsは設定が効く方式で、空なら全方式。
      responses:
        '200':
          description: 設定の一覧
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettingCatalog'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/analyze:
    post:
      operationId: analyze
      summary: 文章を読みとモーラ列へ変換
      description: 合成と同じ並列枠を使う。languageは必須。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language, text]
              properties:
                language: {type: string, description: 'ja・en・zh・es・pt'}
                text: {type: string, minLength: 1, x-default-maxLength: 500}
                dictionary:
                  type: array
                  nullable: true
                  items: {$ref: '#/components/schemas/DictionaryEntry'}
      responses:
        '200':
          description: 読みとモーラ列
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '408': {$ref: '#/components/responses/Timeout'}
        '413': {$ref: '#/components/responses/LimitExceeded'}
        '422': {$ref: '#/components/responses/SynthesisError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/synthesize/audio:
    post: &synthesisOperation
      operationId: synthesizeAudio
      summary: 単一発話をWAVへ合成
      requestBody: {$ref: '#/components/requestBodies/Synthesis'}
      responses: &synthesisResponses
        '200':
          description: 合成完了後のWAV全体。低遅延ストリーミングではない。
          headers: &synthesisHeaders
            X-UtauTTS-Method:
              description: 合成の方式
              schema: {type: string}
            X-UtauTTS-Reading:
              description: 使用した読み
              schema: {type: string}
            X-UtauTTS-Diagnostic-Count:
              description: 描画の診断と不足音素の警告の件数。詳細は /api/synthesize/report で取得する。
              schema: {type: integer, minimum: 0}
          content:
            audio/wav:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '408': {$ref: '#/components/responses/Timeout'}
        '413': {$ref: '#/components/responses/LimitExceeded'}
        '422': {$ref: '#/components/responses/SynthesisError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/synthesize/label:
    post:
      <<: *synthesisOperation
      operationId: synthesizeLabel
      summary: 単一発話の音素ラベルを取得
      responses:
        <<: *synthesisResponses
        '200':
          description: 計画由来のHTK形式LAB。100 ns単位。波形の強制アライメントではない。
          headers: *synthesisHeaders
          content:
            text/plain:
              schema: {type: string}
  /api/synthesize/report:
    post:
      operationId: synthesizeReport
      summary: 単一発話を合成し、診断を含む結果情報をJSONで取得
      description: 波形は返さない。X-UtauTTS-Diagnostic-Count が数える診断の詳細を diagnostics で返す。
      requestBody: {$ref: '#/components/requestBodies/Synthesis'}
      responses:
        '200':
          description: 合成結果の情報
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SynthesisReport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '408': {$ref: '#/components/responses/Timeout'}
        '413': {$ref: '#/components/responses/LimitExceeded'}
        '422': {$ref: '#/components/responses/SynthesisError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/synthesize/jobs:
    post:
      operationId: createSynthesisJob
      summary: 合成を非同期で開始し、ジョブIDを返す
      description: |
        202でジョブIDを返し、合成は実行枠の空きを待って進む。要求の検証は受け付け時に行い、
        入力不正は202ではなく400・413で返す。進捗は GET /api/synthesize/jobs/{job_id} を繰り返し呼んで取得する。
      requestBody: {$ref: '#/components/requestBodies/Synthesis'}
      responses:
        '202':
          description: 受け付けた
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SynthesisJobCreated'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '413': {$ref: '#/components/responses/LimitExceeded'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/synthesize/jobs/{job_id}:
    get:
      operationId: getSynthesisJob
      summary: 合成ジョブの状態と進捗
      description: |
        完了するまで繰り返し呼ぶ。queuedは実行枠待ちで、queue_positionが先に並んでいる件数。
        runningは合成中。succeededならresultに合成結果の情報が入る。failedならerrorとcodeが入る。
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: ジョブの状態
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SynthesisJob'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/synthesize/jobs/{job_id}/audio:
    get:
      operationId: getSynthesisJobAudio
      summary: 完了した合成ジョブのWAV
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 合成完了後のWAV全体
          headers: *synthesisHeaders
          content:
            audio/wav:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '409': {$ref: '#/components/responses/NotReady'}
  /api/synthesize/batch:
    post:
      operationId: synthesizeBatch
      summary: 複数発話をWAV・任意のTXTとLABのZIPで取得
      description: |
        逐次合成。途中で失敗すると後続を合成せず、item Nを含むエラーを返す。
        ZIPは完成後に送信し、途中のZIPは返さない。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchRequest'}
      responses:
        '200':
          description: 非圧縮WAV合計は256 MiBまで。
          headers:
            Content-Disposition:
              schema: {type: string, example: 'attachment; filename="utautts-audio.zip"'}
          content:
            application/zip:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '408': {$ref: '#/components/responses/Timeout'}
        '413': {$ref: '#/components/responses/LimitExceeded'}
        '422': {$ref: '#/components/responses/SynthesisError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  requestBodies:
    Synthesis:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SynthesisRequest'}
          example: {reading: ア, apply_pitch: false}
  responses:
    InvalidRequest:
      description: JSON・必須項目・範囲等の入力不正はinvalid_request。項目名はfield、期待する形式はexpectedに入る。資源不足は既存の400を維持してunavailable。
      content: &errorContent
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Hostが非ローカル、または別サイトからのブラウザ操作。codeはforbidden。
      content: *errorContent
    NotFound:
      description: 未定義のパス、または存在しないジョブ。codeはnot_found。
      content: *errorContent
    MethodNotAllowed:
      description: パスはあるがメソッドが違う。codeはmethod_not_allowed。Allowヘッダーに使えるメソッドを返す。
      content: *errorContent
    Timeout:
      description: 要求キャンセルはcanceled、要求の期限切れはdeadline_exceeded。切断後は受信できない場合がある。
      content: *errorContent
    LimitExceeded:
      description: 本文・文字数・編集要素・一括合成の上限超過。codeはlimit_exceeded。
      content: *errorContent
    SynthesisError:
      description: 読み解析・合成の失敗。codeはsynthesis_error。
      content: *errorContent
    TooManyRequests:
      description: 実行枠が空かないまま待ち時間の上限を過ぎた。codeはtoo_many_requests。Retry-After秒後に再試行する。
      content: *errorContent
    NotReady:
      description: ジョブがまだ完了していない。codeはnot_ready。
      content: *errorContent
    InternalError:
      description: 再読込・一時ファイル・ZIP出力等の失敗。codeはinternal_error。
      content: *errorContent
    Unavailable:
      description: 終了済みRuntimeはunavailable（503）。
      content: *errorContent
  schemas:
    Error:
      type: object
      required: [error, code]
      description: |
        codeはHTTPの語彙。CLIのエラーコードはx-cli-code-aliasesの表でこの語彙へ対応づける。
      x-cli-code-aliases:
        invalid_arguments: invalid_request
        flag_parse_error: invalid_request
        input_error: invalid_request
        initialization_error: unavailable
        shutdown_error: internal_error
        output_error: internal_error
      properties:
        error: {type: string, description: 既存クライアント向けの説明文字列。一括合成ではitem Nを含む。}
        code:
          type: string
          enum: [invalid_request, limit_exceeded, unavailable, synthesis_error, canceled, deadline_exceeded, forbidden, internal_error, not_found, method_not_allowed, too_many_requests, not_ready]
        field: {type: string, description: '入力不正の項目名。JSONの項目名か、一括合成のitemsのnameのような位置。'}
        expected: {type: string, description: その項目に期待する形式。}
    SynthesisRequest:
      type: object
      additionalProperties: false
      description: |
        textか有効な読みが必須。readingが空でなければkanaより優先し、読みがあればtextより優先する。
        設定は直下の項目かsettingsで指定する。同じ設定が両方にあればsettingsを優先する。
        nullのスカラーはデコード済みの既定値を変えない。nullの配列・任意オブジェクトは未指定扱い。
      required: [method, language, voicebank_id]
      anyOf:
        - required: [text]
          properties: {text: {type: string, minLength: 1}}
        - required: [reading]
          properties: {reading: {type: string, minLength: 1}}
        - required: [kana]
          properties: {kana: {type: string, minLength: 1}}
      properties:
        text: {type: string, nullable: true, default: '', x-default-maxLength: 500}
        reading: {type: string, nullable: true, default: '', x-default-maxLength: 500}
        kana: {type: string, nullable: true, default: '', x-default-maxLength: 500, deprecated: true, description: readingの互換名。readingが空の場合に使う。}
        language: {type: string, description: 'ja・en・zh・es・pt。省略できない。'}
        method: {type: string, enum: [waveform-synthesis, reference-matching], description: 合成の方式。省略できない。}
        phonemizer: {type: string, nullable: true, default: '', description: 'ja-kana・en-arpasing・en-delta・en-vccv・en-cv・zh-cvvc。空なら自動選択。'}
        voicebank_id: {type: string, description: 登録音源のID。省略できない。}
        model_id: {type: string, nullable: true, default: '', description: 抑揚モデルID。空またはnoneなら使わない。同梱から外したIDはエラー。}
        model_path: {type: string, nullable: true, default: '', description: ローカルモデルパスの互換入力。model_idより優先する。}
        tone: {type: string, nullable: true, default: '', description: '読み上げの基準の音程（例: C4）。空なら音源の録音の高さで読み上げ、原音はC4として選ぶ。'}
        color: {type: string, nullable: true, default: ''}
        dictionary:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/DictionaryEntry'}
        mora_duration_ms: {type: number, nullable: true, default: 120, minimum: 0, maximum: 1000, description: 基本モーラ長。ゼロは合成時の既定値を使う。}
        pause_duration_ms: {type: number, nullable: true, default: 180, minimum: 0, maximum: 3000, description: 休止長。明示ゼロも合成時の既定値扱い。}
        intonation_strength: {type: number, nullable: true, default: 4, minimum: 0, maximum: 8}
        apply_pitch: {type: boolean, nullable: true, default: true}
        context_duration: {type: boolean, nullable: true, default: false}
        boundary_tone: {type: boolean, nullable: true, default: true}
        stretch_adapt: {type: boolean, nullable: true, default: true}
        pause_context: {type: boolean, nullable: true, default: true}
        settings:
          type: object
          nullable: true
          additionalProperties: true
          description: 設定のmap。IDは /api/settings のものと、参照照合の reference_blend（on か off、既定値 on）。未知のID、型の合わない値、範囲外の値は使わず、結果のdiagnosticsで返す。
        mora_durations_ms:
          type: array
          nullable: true
          x-default-maxItems: 500
          items: {type: number, minimum: 0, maximum: 1000}
        unit_overrides:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/UnitOverride'}
        manual_pitch:
          $ref: '#/components/schemas/ManualPitch'
        pitch_curve:
          $ref: '#/components/schemas/PitchCurve'
        alias_policy: {type: string, nullable: true, default: '', description: '空またはauto・cvvc-enhanced・vcv-prefer・cvvc-prefer・cv-only。'}
        leading_preutterance_ms: {type: number, nullable: true, default: 0, minimum: 0, maximum: 1000, description: ゼロならoto.iniから決定}
        release_ms: {type: number, nullable: true, default: 0, description: release_setがtrueのときだけ使う。未指定時の合成リリースは20 ms。}
        release_set: {type: boolean, nullable: true, default: false, description: trueならrelease_msの明示ゼロも適用}
        context_duration_strength: {type: number, nullable: true, default: 1, description: 互換入力。ゼロは合成時の既定値1。}
        boundary_tone_strength: {type: number, nullable: true, default: 1, description: 互換入力。ゼロは合成時の既定値1。}
        stretch_adapt_strength: {type: number, nullable: true, default: 1, description: 互換入力。ゼロは合成時の既定値1。}
        pause_context_strength: {type: number, nullable: true, default: 1, description: 互換入力。ゼロは合成時の既定値1。}
    DictionaryEntry:
      type: object
      additionalProperties: false
      description: 空のsurfaceまたはreadingを持つ項目は辞書へ追加しない。
      properties:
        surface: {type: string, nullable: true, default: ''}
        reading: {type: string, nullable: true, default: ''}
    ManualPitch:
      type: object
      nullable: true
      additionalProperties: false
      required: [version]
      description: モーラ位置・重複・休止への指定は合成時にも検証する。framesモードはpointsと併用不可。
      properties:
        version: {type: integer, enum: [1]}
        reading: {type: string, nullable: true, default: ''}
        mode: {type: string, nullable: true, default: '', description: 空ならoffset。offset・replace・framesに対応。}
        points:
          type: array
          nullable: true
          x-default-maxItems: 1000
          items: {$ref: '#/components/schemas/ManualPitchPoint'}
        frames:
          type: array
          nullable: true
          description: framesモードでは最大20000個、10 ms単位、各値±1200 cent。その他のモードでは使わない。
          items: {type: number}
    ManualPitchPoint:
      type: object
      additionalProperties: false
      properties:
        position: {type: integer, nullable: true, minimum: 0, default: 0}
        mora: {type: string, nullable: true, default: ''}
        cents: {type: number, nullable: true, minimum: -1200, maximum: 1200, default: 0}
    PitchCurve:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        frame_ms: {type: number, nullable: true}
        cents: {type: array, nullable: true, items: {type: number}}
    UnitOverride:
      type: object
      additionalProperties: false
      description: 原音単位の編集。unit_indexの範囲・重複は合成時に検証する。
      properties:
        unit_index: {type: integer, nullable: true, minimum: 0, default: 0}
        offset_ms: {type: number, nullable: true}
        cutoff_ms: {type: number, nullable: true}
        consonant_ms: {type: number, nullable: true, minimum: 0}
        preutterance_ms: {type: number, nullable: true, minimum: 0}
        overlap_ms: {type: number, nullable: true, minimum: 0}
        pitch_factor: {type: number, nullable: true, minimum: 0, exclusiveMinimum: true}
        energy_factor: {type: number, nullable: true, minimum: 0, exclusiveMinimum: true}
        resampler_volume: {type: integer, nullable: true, minimum: 0, maximum: 200}
    BatchRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        write_text: {type: boolean, nullable: true, default: false}
        write_lab: {type: boolean, nullable: true, default: false}
        text_encoding: {type: string, nullable: true, default: '', description: TXT書込時は空またはutf-8・shift_jis}
        items:
          type: array
          minItems: 1
          x-default-maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [request]
            properties:
              name: {type: string, nullable: true, default: '', description: 'パス部分を除去し、.wavを補う。空・..等はutterance-N.wav。重複は400。'}
              request: {$ref: '#/components/schemas/SynthesisRequest'}
    Health:
      type: object
      required: [status, version, synthesis, batch]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string}
        synthesis: {$ref: '#/components/schemas/Concurrency'}
        batch: {$ref: '#/components/schemas/Concurrency'}
    Concurrency:
      type: object
      required: [limit, active, queued]
      properties:
        limit: {type: integer, minimum: 0, description: 同時に実行できる件数}
        active: {type: integer, minimum: 0, description: 実行中の件数}
        queued: {type: integer, minimum: 0, description: 実行枠を待っている件数}
    Analysis:
      type: object
      required: [reading, morae]
      properties:
        reading: {type: string}
        morae:
          type: array
          items:
            type: object
            required: [position, mora, consonant, vowel, pause]
            properties:
              position: {type: integer}
              mora: {type: string}
              consonant: {type: string}
              vowel: {type: string}
              pause: {type: boolean}
    SynthesisReport:
      type: object
      required: [reading, method, duration_ms, sample_rate, channels, unit_count, phoneme_labels, diagnostics]
      properties:
        reading: {type: string}
        method: {type: string}
        duration_ms: {type: number}
        sample_rate: {type: integer}
        channels: {type: integer}
        unit_count: {type: integer}
        phoneme_labels: {type: string, description: HTK形式LAB。100 ns単位。}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/Diagnostic'}
        logs: {type: array, nullable: true, items: {type: string}, description: 索引の作成など時間のかかる処理の途中経過。}
    Diagnostic:
      type: object
      required: [message]
      properties:
        severity: {type: string}
        code: {type: string}
        message: {type: string}
    SynthesisJobCreated:
      type: object
      required: [job_id, status, status_url]
      properties:
        job_id: {type: string}
        status: {type: string, enum: [queued]}
        status_url: {type: string}
    SynthesisJob:
      type: object
      required: [job_id, status, queue_position, created_at, elapsed_ms]
      properties:
        job_id: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        queue_position: {type: integer, minimum: 0, description: 実行枠を待っている間に先に並んでいるジョブの数。queued以外は0。}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        elapsed_ms: {type: integer, description: 開始からの経過。未開始なら受け付けからの経過。}
        result: {$ref: '#/components/schemas/SynthesisReport'}
        error: {type: string, description: 失敗したときの説明。}
        code: {type: string, description: 失敗したときのエラーコード。Error.codeと同じ語彙。}
        field: {type: string}
        expected: {type: string}
    Voicebank:
      type: object
      required: [id, name, path, oto_file_count, phoneme_count, diagnostic_count, alias_counts, vcv_contexts, vc_contexts, has_vc, has_initial_vcv, has_n_context_vcv]
      properties:
        id: {type: string, description: voice-dirからの相対パス。入れ子はスラッシュ区切り。}
        name: {type: string}
        path: {type: string}
        kind: {type: string}
        types: {type: array, items: {$ref: '#/components/schemas/SubbankOption'}}
        oto_file_count: {type: integer}
        phoneme_count: {type: integer}
        diagnostic_count: {type: integer}
        alias_counts: {type: object, nullable: true, additionalProperties: {type: integer}}
        vcv_contexts: {type: object, nullable: true, additionalProperties: {type: integer}}
        vc_contexts: {type: object, nullable: true, additionalProperties: {type: integer}}
        has_vc: {type: boolean}
        has_initial_vcv: {type: boolean}
        has_n_context_vcv: {type: boolean}
    SubbankOption:
      type: object
      required: [id, color]
      properties:
        id: {type: string}
        color: {type: string}
        prefix: {type: string}
        suffix: {type: string}
        tone_ranges:
          type: array
          items:
            type: object
            required: [low, high]
            properties: {low: {type: integer}, high: {type: integer}}
    Model:
      type: object
      required: [id, display_name, path, version, feature_version, mode, sha256]
      properties:
        id: {type: string}
        display_name: {type: string}
        description: {type: string}
        language: {type: string}
        path: {type: string}
        version: {type: integer}
        feature_version: {type: integer}
        mode: {type: string}
        sha256: {type: string}
        outputs: {type: object, additionalProperties: {type: boolean}}
        default_priority: {type: integer}
        requires_features: {type: boolean}
        frame_contour: {type: boolean}
    SettingCatalog:
      type: object
      required: [settings, problems]
      properties:
        settings: {type: array, items: {$ref: '#/components/schemas/Setting'}}
        problems: {type: array, nullable: true, items: {type: string}}
    Setting:
      type: object
      required: [id, type]
      properties:
        id: {type: string}
        type: {type: string}
        group: {type: string}
        default: {}
        min: {type: number}
        max: {type: number}
        step: {type: number}
        label: {type: string}
        options: {type: array, items: {$ref: '#/components/schemas/SettingOption'}}
        methods: {type: array, items: {type: string}}
        languages: {type: array, items: {type: string}}
    SettingOption:
      type: object
      required: [value]
      properties:
        value: {type: string}
        label: {type: string}
