name: web-reference

# Web版の参照照合のモデル（KokoroとWavLMのONNX）を書き出し、R2の固定の場所（cmd/tools/cloudflareのreferencePrefix）へ置く。
# モデルを書き出し直したときだけ、referencePrefixの版を上げて手動で実行する。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install export tools
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install onnx==1.23.2 onnxscript==0.7.2 kokoro==0.9.4 misaki==0.9.4 transformers==5.14.1 numpy==2.2.4 safetensors
      - name: Fetch models
        run: bash tools/fetch-reference-models.sh
      - name: Export ONNX
        run: python tools/web-reference/export.py models/reference models/reference/wavlm web/dist/reference
      - name: Upload to R2
        env:
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          go run ./cmd/tools/cloudflare package-reference --source web/dist/reference --output out/cloudflare-reference
          go run ./cmd/tools/cloudflare upload --output out/cloudflare-reference
