name: Windows package

on:
  workflow_call:
    inputs:
      expected_version:
        description: "Version that must match the tag being packaged"
        required: false
        type: string
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_VERSION: '6.8.3'
      UTAUTTS_RELEASE_VERSION: ${{ inputs.expected_version || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt

      - name: Install Qt and MinGW
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = Join-Path $env:RUNNER_TEMP 'qt'
          python -m pip install --disable-pip-version-check 'aqtinstall==3.3.0'
          python -m aqt install-qt `
            --outputdir $qtRoot `
            windows desktop $env:QT_VERSION win64_mingw `
            --modules qtmultimedia

          $mingwVariants = @(python -m aqt list-tool windows desktop tools_mingw |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -match '^qt\.tools\.win64_mingw1310(?:_64)?$' })
          if ($mingwVariants.Count -eq 0) {
            python -m aqt list-tool windows desktop tools_mingw
            throw 'The Qt MinGW 13.1 tool variant was not found.'
          }
          $mingwVariant = $mingwVariants[0]
          python -m aqt install-tool --outputdir $qtRoot windows desktop tools_mingw $mingwVariant
          python -m aqt install-tool --outputdir $qtRoot windows desktop tools_cmake
          python -m aqt install-tool --outputdir $qtRoot windows desktop tools_ninja

          $qtKit = Join-Path $qtRoot "$env:QT_VERSION\mingw_64"
          $qtTools = Join-Path $qtRoot 'Tools'
          $qtMinGW = Join-Path $qtTools 'mingw1310_64'
          if (-not (Test-Path -LiteralPath (Join-Path $qtKit 'bin/windeployqt.exe'))) {
            throw "Qt kit was not installed at $qtKit"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $qtMinGW 'bin/gcc.exe'))) {
            throw "Qt MinGW compiler was not installed at $qtMinGW"
          }

          "QT_ROOT=$qtKit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_TOOLS_ROOT=$qtTools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_MINGW_ROOT=$qtMinGW" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare the Go cgo compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msys2Root = 'C:\msys64'
          $bash = Join-Path $msys2Root 'usr/bin/bash.exe'
          if (-not (Test-Path -LiteralPath $bash)) {
            throw "MSYS2 was not found at $msys2Root"
          }
          $clang = Join-Path $msys2Root 'mingw64/bin/clang.exe'
          if (-not (Test-Path -LiteralPath $clang)) {
            & $bash -lc 'pacman -Sy --noconfirm mingw-w64-x86_64-clang'
            if ($LASTEXITCODE -ne 0) {
              throw 'MSYS2 clang installation failed.'
            }
          }
          if (-not (Test-Path -LiteralPath $clang)) {
            throw "MSYS2 clang was not found at $clang"
          }
          "MSYS2_ROOT=$msys2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and smoke-test Windows packages
        shell: pwsh
        run: .\tools\build-release.ps1 -Profile Full

      - name: Upload Windows packages
        uses: actions/upload-artifact@v6
        with:
          name: utautts-windows-x64
          path: release/*-win-x64.zip
          if-no-files-found: error
          retention-days: 14
