name: wasm

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+']
    paths:
      - 'web/**'
      - 'qt/**'
      - 'renderer/utautts-world-phrase/**'
      - 'cmd/utautts-wasm/**'
      - 'cmd/tools/build-voice/**'
      - 'cmd/tools/cloudflare/**'
      - 'cmd/utautts-worldline-bridge/**'
      - 'internal/**'
      - 'native/**'
      - 'third_party/open_jtalk/**'
      - '.github/workflows/wasm.yml'
  pull_request:
    paths: ['web/**', 'qt/**', 'cmd/tools/build-voice/**', 'cmd/tools/cloudflare/**', '.github/workflows/wasm.yml']
  workflow_dispatch:
    inputs:
      preview_name:
        description: 'Preview name (lowercase letters, digits, hyphens). Production requires a vX.X.X tag; vX.X.X-beta.N tags deploy to a preview.'
        type: string
        default: dev
        required: true

permissions:
  contents: read

concurrency:
  group: wasm-${{ startsWith(github.ref, 'refs/tags/') && 'releases' || github.event_name == 'workflow_dispatch' && format('preview-{0}', inputs.preview_name) || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

env:
  QT_VERSION: 6.8.3
  EMSDK_BRIDGE_VERSION: 6.0.10
  EMSDK_QT_VERSION: 3.1.56
  EMSDK_DIR: ${{ github.workspace }}/.emsdk-bridge
  EMSDK_QT_DIR: ${{ github.workspace }}/.emsdk-qt
  QT_HOST_DIR: ${{ github.workspace }}/.qt-host
  QT_WASM_ROOT: ${{ github.workspace }}/.qt-wasm

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check wasm regressions and deployment packaging
        run: |
          node --test web/test-wasm-regressions.cjs web/test-asset-paths.cjs
          go test ./cmd/tools/build-voice ./cmd/tools/cloudflare

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      branch: ${{ steps.plan.outputs.branch }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployment settings
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os
          names = ('CF_PAGES_PROJECT', 'CF_R2_BUCKET', 'R2_PUBLIC_BASE_URL',
                   'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub Variables/Secrets: ' + ', '.join(missing) + '. See docs/wasm-deployment.md')
          PY
      - name: Select release or preview
        id: plan
        env:
          PREVIEW_NAME: ${{ inputs.preview_name }}
        run: |
          go run ./cmd/tools/cloudflare plan \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --preview-name "${PREVIEW_NAME:-dev}" --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Install cmake and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Set up Emscripten (bridges)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
          "$EMSDK_DIR/emsdk" install "$EMSDK_BRIDGE_VERSION"
          "$EMSDK_DIR/emsdk" activate "$EMSDK_BRIDGE_VERSION"
      - name: Fetch Open JTalk dictionary
        run: |
          python -m pip install --quiet pyopenjtalk==0.4.1
          # 初回の辞書ダウンロードは標準出力へ進捗を書くので、GITHUB_ENVへ書く前に済ませる。
          python -c "import pyopenjtalk; pyopenjtalk.run_frontend('テスト')" > /dev/null
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          import pyopenjtalk
          print('OPENJTALK_DICT=' + os.path.join(os.path.dirname(pyopenjtalk.__file__), 'open_jtalk_dic_utf_8-1.11'))
          PY
      - name: Build Go wasm
        run: bash web/build.sh
      - name: Build WORLD and Open JTalk wasm
        run: |
          source "$EMSDK_DIR/emsdk_env.sh"
          bash web/build-world.sh
          bash web/build-openjtalk.sh
      - name: Install Qt (desktop host and wasm kit)
        run: |
          python -m pip install --quiet aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" gcc_64 -O "$QT_HOST_DIR"
          aqt install-qt linux desktop "$QT_VERSION" wasm_singlethread -O "$QT_WASM_ROOT"
      - name: Set up Emscripten (Qt)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK_QT_DIR"
          "$EMSDK_QT_DIR/emsdk" install "$EMSDK_QT_VERSION"
          "$EMSDK_QT_DIR/emsdk" activate "$EMSDK_QT_VERSION"
      - name: Build Qt wasm app
        env:
          QT_WASM_DIR: ${{ env.QT_WASM_ROOT }}/${{ env.QT_VERSION }}/wasm_singlethread
          QT_HOST_PATH: ${{ env.QT_HOST_DIR }}/${{ env.QT_VERSION }}/gcc_64
        run: |
          source "$EMSDK_QT_DIR/emsdk_env.sh"
          bash qt/wasm/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check real browser startup and synthesis with split origins
        run: |
          npm install --prefix "$RUNNER_TEMP/wasm-browser" --no-package-lock --no-save playwright@1.51.1
          "$RUNNER_TEMP/wasm-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/wasm-browser/node_modules" node web/test-cloudflare-browser.cjs
      - name: Split Pages and R2 assets
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          DEPLOYMENT_ID: ${{ steps.plan.outputs.deployment_id }}
          VERSION: ${{ steps.plan.outputs.version }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
        run: |
          go run ./cmd/tools/cloudflare package --output out/cloudflare --public-url "$R2_PUBLIC_BASE_URL" \
            --deployment-id "$DEPLOYMENT_ID" --version "$VERSION" --revision "$GITHUB_SHA" --channel "$CHANNEL"
      - uses: actions/upload-artifact@v4
        with:
          name: utautts-cloudflare
          path: out/cloudflare
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: utautts-cloudflare
          path: out/cloudflare
      - name: Upload and verify R2 assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          go run ./cmd/tools/cloudflare upload
      - name: Check R2 public access before publishing Pages
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: go run ./cmd/tools/cloudflare verify-assets --origin "https://${CF_PAGES_PROJECT}.pages.dev"
      - name: Publish to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy out/cloudflare/pages --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=${{ needs.build.outputs.branch }}
      - name: Verify deployed entry point and R2 assets
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          go run ./cmd/tools/cloudflare verify --pages-url "$DEPLOYMENT_URL"
          echo "### wasm deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
