name: Linux package

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QT_VERSION: '6.8.3'
      PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-build.txt

      - name: Install native and Qt dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config unzip zip curl ca-certificates \
            python3-dev python3-pip python3-venv \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-tools-dev qt6-l10n-tools \
            qml6-module-qtquick-controls qml6-module-qtmultimedia \
            fontconfig fonts-noto-cjk

      - name: Install Qt SDK
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'aqtinstall==3.3.0'
          python -m aqt install-qt \
            --outputdir "$RUNNER_TEMP/qt" \
            linux desktop "$QT_VERSION" gcc_64 \
            --modules qtmultimedia
          echo "QT_ROOT=$RUNNER_TEMP/qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Build and smoke-test Linux packages
        shell: bash
        run: bash tools/build-linux.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: utautts-linux-x64
          path: release/*-linux-x64.zip
          if-no-files-found: error
          retention-days: 14
