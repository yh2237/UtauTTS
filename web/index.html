<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UtauTTS wasm</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 900px; }
  textarea { width: 100%; box-sizing: border-box; font-size: 1rem; }
  #curve { width: 100%; height: 220px; border: 1px solid #ccc; border-radius: 6px; }
  #status { color: #666; }
  #out { background: #f6f8fa; padding: 0.75rem; border-radius: 6px; overflow: auto; max-height: 320px; }
  .row { display: flex; gap: 0.75rem; align-items: center; margin: 0.75rem 0; flex-wrap: wrap; }
</style>
</head>
<body>
<h1>UtauTTS wasm</h1>
<p>日本語テキストをOpen JTalk wasmで解析し、抑揚モデルで10msピッチ曲線を生成します。</p>
<div class="row">
  <label>抑揚の強さ <input id="strength" type="number" value="1" min="0" max="4" step="0.1" /></label>
  <button id="run">予測</button>
  <span id="status">initializing…</span>
</div>
<textarea id="text" rows="3">こんにちは、今日はいい天気です。</textarea>
<canvas id="curve" width="860" height="220"></canvas>
<pre id="out"></pre>
<script src="./wasm_exec.js"></script>
<script src="./fs-shim.js"></script>
<script src="./openjtalk-bridge.js"></script>
<script src="./openjtalk/utautts-openjtalk.js"></script>
<script src="./main.js"></script>
</body>
</html>
