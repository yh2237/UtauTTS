<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, user-scalable=0, viewport-fit=cover" />
<title>UtauTTS (wasm)</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f6f6f6; font-family: system-ui, sans-serif; color: #000; }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f6f6f6; z-index: 10; }
  #loading.hidden { display: none; }
  .spinner { width: 28px; height: 28px; border: 3px solid #aeb4ba; border-top-color: #d35f6b; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 13px; color: #6b7075; }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div id="status">エンジンを読み込み中…</div></div>
<div id="screen"></div>

<!-- Go エンジン（メインスレッド） -->
<script src="/web/dist/config.js"></script>
<script src="/web/dist/wasm_exec.js"></script>
<script src="/web/dist/fs-shim.js"></script>
<script src="/web/dist/openjtalk-bridge.js"></script>
<script src="/web/dist/world-bridge.js"></script>
<script src="/web/dist/openjtalk/utautts-openjtalk.js"></script>
<script src="/web/dist/world/utautts-world.js"></script>
<script src="./engine-loader.js"></script>

<!-- Qt wasm アプリ -->
<script src="./utautts.js"></script>
<script src="./qtloader.js"></script>
<script>
  async function init() {
    const loading = document.getElementById("loading");
    const screen = document.getElementById("screen");
    const status = document.getElementById("status");
    const statusTimer = setInterval(() => {
      if (window.utauttsEngineStatus)
        status.textContent = window.utauttsEngineStatus;
    }, 200);
    try {
      status.textContent = "エンジンを読み込み中…";
      await Promise.race([
        window.utauttsEngineReady,
        new Promise((_, reject) => setTimeout(() => reject(new Error("engine load timeout")), 180000)),
      ]);
      clearInterval(statusTimer);
      status.textContent = "UIを起動中…";
      const qtInstance = await qtLoad({
        qt: {
          fontDpi: 96,
          onLoaded: () => { loading.classList.add("hidden"); },
          onExit: (data) => {
            status.textContent = "終了" + (data && data.code !== undefined ? " (code " + data.code + ")" : "");
            loading.classList.remove("hidden");
          },
          entryFunction: window.utautts_entry,
          containerElements: [screen],
        },
      });
      window.utauttsQtModule = qtInstance || window.Module;
      window.utauttsRefreshMetadata = () => {
        const module = window.utauttsQtModule;
        if (module && typeof module._utauttsRefreshMetadata === "function") {
          module._utauttsRefreshMetadata();
        }
      };
      if (typeof window.utauttsFlushPendingResults === "function") {
        window.utauttsFlushPendingResults();
      }
    } catch (error) {
      clearInterval(statusTimer);
      status.textContent = "エラー: " + error;
      console.error(error);
    }
  }
  window.addEventListener("load", init);
</script>
</body>
</html>
