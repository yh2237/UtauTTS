<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, user-scalable=0, viewport-fit=cover" />
<title>UtauTTS</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f6f6f6; font-family: system-ui, sans-serif; color: #000; overscroll-behavior: none; }
  canvas { touch-action: none; }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f6f6f6; z-index: 10; }
  #loading.hidden { display: none; }
  .spinner { width: 28px; height: 28px; border: 3px solid #aeb4ba; border-top-color: #d35f6b; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 13px; color: #6b7075; }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div id="status">エンジンを読み込み中…</div></div>
<div id="screen"></div>

<script src="./config.js"></script>
<script src="./asset-paths.js"></script>
<script src="./bootstrap.js"></script>
</body>
</html>
